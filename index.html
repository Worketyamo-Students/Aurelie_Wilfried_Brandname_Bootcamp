<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandname Page</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-main:"Montserrat", sans-serif;
        --color-primary: #FF6551;
        --color-bacground-dark-blue:#26335D;
        --color-secondary:#2435A1;
        --color-background-white:#FFFFFF;
        --color-text:#252B42;
        --color-second-text:#737373;
        --color-light-blue:#2435A1;
        --color-dark-orange:#E77C40;
        --color-green:#2DC071;
        --color-grey:#BDBDBD;
        --color-yellow:#F3CD03; 
        --color-light-pink:#FEB896;
        --color-another-light-blue:#B6D7FF;
      }
    </style>
</head>
<body class="w-screen h-screen">
  <section class="bg-bacground-dark-blue h-3/5 w-full">
    <header class="h-15 w-full px-20 py-3 items-center justify-between flex text-background-white font-main-700">
      
      <div class="flex h-full w-2/4 justify-between">
        <a href="#" class="text-[1.5rem]">Brandname</a>
        <ul class="hidden lg:flex  items-center justify-between h-full w-2/4 text-[0.8rem] *:hover:border-b-2 *:hover:border-another-light-blue">
          <li>Home</li>
          <li>Product</li>
          <li>Pricing</li>
          <li>Contact</li>
        </ul>
      </div>

      <div class="h-full w-40 flex items-center text-[0.8rem] gap-x-7">
        <p>Login</p>
        <button class="bg-primary w-50 h-full px-4 flex items-center gap-x-1 rounded-md">
          <h4>JOIN US</h4>
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>
      </div>

      <div class=" block lg:hidden text-[3rem] flex items-center ml-20" >
        <ion-icon name="menu-outline"></ion-icon>
      </div>
    </header>
  </section>
</body>
</html>
